Screens:
  FormScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conForm:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - lblTitle:
                Control: Label@2.5.1
                Properties:
                  FontWeight: =FontWeight.Bold
                  Height: =50
                  Size: =24
                  Text: ="New client"
                  Width: =900
                  X: =40
                  Y: =20
            - lblRequiredHint:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(96, 96, 96, 1)
                  Height: =30
                  Text: ="Fields marked * are required."
                  Width: =900
                  X: =40
                  Y: =70
            - lblCompanyName:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Company Name *"
                  Width: =620
                  X: =40
                  Y: =110
            - txtCompanyName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Company Name"
                  Width: =620
                  X: =40
                  Y: =142
            - lblRegistrationNumber:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Registration Number"
                  Width: =620
                  X: =40
                  Y: =200
            - txtRegistrationNumber:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Registration Number"
                  Width: =620
                  X: =40
                  Y: =232
            - lblIndustry:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Industry"
                  Width: =620
                  X: =40
                  Y: =290
            - txtIndustry:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Industry"
                  Width: =620
                  X: =40
                  Y: =322
            - lblWebsite:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Website"
                  Width: =620
                  X: =40
                  Y: =380
            - txtWebsite:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Website"
                  Width: =620
                  X: =40
                  Y: =412
            - lblCountry:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Country"
                  Width: =620
                  X: =40
                  Y: =470
            - txtCountry:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Country"
                  Width: =620
                  X: =40
                  Y: =502
            - lblContactName:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Contact Name *"
                  Width: =620
                  X: =700
                  Y: =110
            - txtContactName:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Contact Name"
                  Width: =620
                  X: =700
                  Y: =142
            - lblContactEmail:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Contact Email *"
                  Width: =620
                  X: =700
                  Y: =200
            - txtContactEmail:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Contact Email"
                  Width: =620
                  X: =700
                  Y: =232
            - lblContactEmailError:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =RGBA(168, 0, 0, 1)
                  Height: =30
                  Size: =11
                  Text: ="Enter a valid e-mail (name@domain.com)"
                  Visible: =!IsBlank(Trim(txtContactEmail.Text)) && !IsMatch(Trim(txtContactEmail.Text), "[^@\s]+@[^@\s.]+(\.[^@\s.]+)+")
                  Width: =460
                  X: =860
                  Y: =200
            - lblContactPhone:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Contact Phone"
                  Width: =620
                  X: =700
                  Y: =290
            - txtContactPhone:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Contact Phone"
                  Width: =620
                  X: =700
                  Y: =322
            - lblAddress:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Address"
                  Width: =620
                  X: =700
                  Y: =380
            - txtAddress:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =45
                  HintText: ="Address"
                  Width: =620
                  X: =700
                  Y: =412
            - lblNotes:
                Control: Label@2.5.1
                Properties:
                  Height: =30
                  Text: ="Notes"
                  Width: =620
                  X: =700
                  Y: =470
            - txtNotes:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: =""
                  Height: =120
                  HintText: ="Notes"
                  Mode: =TextMode.MultiLine
                  Width: =620
                  X: =700
                  Y: =502
            - btnSubmit:
                Control: Classic/Button@2.2.0
                Properties:
                  DisplayMode: =If(IsBlank(Trim(txtCompanyName.Text)) || IsBlank(Trim(txtContactName.Text)) || !IsMatch(Trim(txtContactEmail.Text), "[^@\s]+@[^@\s.]+(\.[^@\s.]+)+"), DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =50
                  OnSelect: |-
                    =IfError(
                        Set(
                            varNewClient,
                            Patch(
                                'New Clients',
                                Defaults('New Clients'),
                                {
                                Title: Trim(txtCompanyName.Text),
                                'Registration Number': Trim(txtRegistrationNumber.Text),
                                Industry: Trim(txtIndustry.Text),
                                Website: Trim(txtWebsite.Text),
                                Country: Trim(txtCountry.Text),
                                'Contact Name': Trim(txtContactName.Text),
                                'Contact Email': Trim(txtContactEmail.Text),
                                'Contact Phone': Trim(txtContactPhone.Text),
                                Address: Trim(txtAddress.Text),
                                Notes: Trim(txtNotes.Text)
                                }
                            )
                        );
                        Reset(txtCompanyName); Reset(txtRegistrationNumber); Reset(txtIndustry); Reset(txtWebsite); Reset(txtCountry); Reset(txtContactName); Reset(txtContactEmail); Reset(txtContactPhone); Reset(txtAddress); Reset(txtNotes);
                        Navigate(SuccessScreen, ScreenTransition.None),
                        Notify("Could not save the client: " & FirstError.Message, NotificationType.Error)
                    )
                  Text: ="Submit"
                  Width: =200
                  X: =40
                  Y: =640
