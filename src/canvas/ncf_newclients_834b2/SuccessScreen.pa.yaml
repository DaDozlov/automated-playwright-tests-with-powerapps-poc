Screens:
  SuccessScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conSuccess:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - lblSuccess:
                Control: Label@2.5.1
                Properties:
                  Height: =60
                  Size: =20
                  Text: ="Thank you! The client was saved (ID " & varNewClient.ID & ")."
                  Width: =1000
                  X: =40
                  Y: =40
            - btnSubmitAnother:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =50
                  OnSelect: =Navigate(FormScreen, ScreenTransition.None)
                  Text: ="Submit another"
                  Width: =240
                  X: =40
                  Y: =130
